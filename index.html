  .lb button:hover { background: rgba(255,255,255,.3); }
  .lb .x { top: calc(env(safe-area-inset-top, 0px) + 16px); right: 16px; }
  .lb .p { left: 14px; top: 50%; }

</style>

/* ===================== Kode render (tidak perlu diubah) ===================== */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v);
  }
  kids.flat().forEach(c => c != null && el.append(c.nodeType ? c : document.createTextNode(c)));
  return el;
}
const ICON_IMG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>';

/* ---------- Lightbox ---------- */
const lb = { srcs: [], i: 0, alt: "" };
function lbShow() { $("#lbImg").src = lb.srcs[lb.i]; $("#lbImg").alt = lb.alt; $("#lb").classList.add("open"); const multi = lb.srcs.length > 1; $("#lbP").hidden = $("#lbN").hidden = !multi; }
function lbOpen(srcs, i, alt) { lb.srcs = srcs; lb.i = i; lb.alt = alt; lbShow(); $("#lbX").focus(); }
function lbClose() { $("#lb").classList.remove("open"); }
function lbStep(d) { lb.i = (lb.i + d + lb.srcs.length) % lb.srcs.length; lbShow(); }
$("#lbX").onclick = lbClose;
$("#lbP").onclick = e => { e.stopPropagation(); lbStep(-1); };
$("#lbN").onclick = e => { e.stopPropagation(); lbStep(1); };
$("#lb").onclick = e => { if (e.target.id === "lb") lbClose(); };
document.addEventListener("keydown", e => {
  if (!$("#lb").classList.contains("open")) return;
  if (e.key === "Escape") lbClose();
  if (e.key === "ArrowLeft") lbStep(-1);
  if (e.key === "ArrowRight") lbStep(1);
});

/* ---------- Media: gambar dengan placeholder otomatis ---------- */
function placeholder(src, label) {
  const p = h("div", { class: "ph" });
  p.innerHTML = ICON_IMG;
  p.append(h("b", { text: label || "Tambahkan gambar" }), h("code", { text: src }));
  return p;
}
function media(images, alt, label) {
  const list = images.slice();
  const ok = list.map(() => false);
  const frame = h("div", { class: "frame" });
  const thumbs = h("div", { class: "thumbs" });
  const wrap = h("div", { class: "media" }, frame);
  const loaded = () => list.filter((_, i) => ok[i]);
  const open = src => () => { const l = loaded(); lbOpen(l, l.indexOf(src), alt); };

  const ph = placeholder(list[0], label);
  frame.append(ph);
  const main = new Image(); main.alt = alt; main.decoding = "async";
  main.onload = () => { ok[0] = true; ph.remove(); main.classList.add("zoom"); main.onclick = open(list[0]); frame.append(main); };
  main.src = list[0];

  if (list.length > 1) {
    wrap.append(thumbs);
    list.slice(1).forEach((src, k) => {
      const idx = k + 1;
      const im = new Image(); im.alt = alt + " (" + (idx + 1) + ")"; im.decoding = "async";
      im.onload = () => {
        ok[idx] = true;
        const t = h("div", { class: "t" }, h("div", { class: "frame" }, im));
        im.onclick = open(src);
        thumbs.append(t);
      };
      im.src = src;
    });
  }
  return wrap;
}

/* ---------- Animasi gelombang SPWM ---------- */
const cv = $("#scope");
const ctx = cv.getContext("2d");
let phase = 0;
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function fitScope() {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, hgt = cv.clientHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function drawScope() {
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W) return;
  ctx.clearRect(0, 0, W, H);
  const ink = css("--ink"), amber = css("--amber"), accent = css("--accent"), line = css("--line");
  const topMid = H * 0.27, topAmp = H * 0.20;
  const botMid = H * 0.78, botAmp = H * 0.13;
  const cycles = W < 560 ? 2 : 3;         // jumlah periode sinus yang tampak
  const ratio = 12;                        // frekuensi carrier / referensi

  // garis tengah
  ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.setLineDash([4, 6]);
  [topMid, botMid].forEach(y => { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); });
  ctx.setLineDash([]);

  const ref = t => Math.sin(2 * Math.PI * t);
  const tri = t => { const f = (t * ratio) % 1; const x = f < 0 ? f + 1 : f; return x < .5 ? 4 * x - 1 : 3 - 4 * x; };

  // sinus referensi
  ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.beginPath();
  for (let x = 0; x <= W; x += 2) { const t = (x / W) * cycles + phase; const y = topMid - ref(t) * topAmp * .85; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();

  // carrier segitiga
  ctx.strokeStyle = amber; ctx.lineWidth = 1.4; ctx.beginPath();
  for (let x = 0; x <= W; x += 1) { const t = (x / W) * cycles + phase; const y = topMid - tri(t) * topAmp; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();

  // keluaran SPWM
  ctx.strokeStyle = accent; ctx.lineWidth = 2.4; ctx.lineJoin = "round"; ctx.beginPath();
  let prev = null;
  for (let x = 0; x <= W; x += 1) {
    const t = (x / W) * cycles + phase;
    const v = ref(t) * .85 > tri(t) ? 1 : -1;
    const y = botMid - v * botAmp;
    if (prev === null) ctx.moveTo(x, y);
    else { if (v !== prev) ctx.lineTo(x, botMid - prev * botAmp); ctx.lineTo(x, y); }
    prev = v;
  }
  ctx.stroke();
}
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function tick() {
  phase += 0.0011;
  drawScope();
  if (!document.hidden) requestAnimationFrame(tick); else document.addEventListener("visibilitychange", function once() { document.removeEventListener("visibilitychange", once); requestAnimationFrame(tick); });
}
window.addEventListener("resize", () => { fitScope(); drawScope(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawScope);
fitScope(); drawScope();
if (!reduce) requestAnimationFrame(tick);
</script>
