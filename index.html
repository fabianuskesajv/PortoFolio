<style>
:root{
  --bg:#07111c; --panel:#0e1b29; --panel-light:#132334;
  --text:#edf3f7; --text-soft:#c1ced8; --text-dim:#899bab;
  --blue:#42a5e8; --blue-bright:#69c3f2;
  --copper:#c47b45; --copper-light:#df9b67;
  --border:rgba(105,195,242,.19); --border-strong:rgba(105,195,242,.45); --border-soft:rgba(237,243,247,.07);
  --shadow:rgba(0,0,0,.35);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --head:"Space Grotesk","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:radial-gradient(circle at 85% 10%,rgba(66,165,232,.08),transparent 30%),var(--bg);color:var(--text);font-family:"IBM Plex Sans","Segoe UI",Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0)}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(105,195,242,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(105,195,242,.035) 1px,transparent 1px);background-size:42px 42px;pointer-events:none;z-index:-1}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
img{max-width:100%;display:block} a{color:inherit} button{font-family:inherit}
:focus-visible{outline:2px solid var(--blue-bright);outline-offset:3px}
.wrap{width:min(calc(100% - 48px),1000px);margin:0 auto}
h1,h2,h3{margin:0;font-family:var(--head);font-weight:600}

/* Navbar */
.navbar{position:sticky;top:0;z-index:50;background:rgba(7,17,28,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-soft);padding-top:env(safe-area-inset-top,0)}
.nav-container{width:min(calc(100% - 48px),1000px);min-height:68px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.nav-logo{font:700 15px var(--head);letter-spacing:.08em;text-decoration:none;white-space:nowrap}
.nav-logo:hover{color:var(--blue-bright)}
.nav-links{display:flex;align-items:center;gap:20px}
.nav-links a{color:var(--text-dim);font:400 10px var(--mono);text-decoration:none;text-transform:uppercase;letter-spacing:.04em;transition:color .2s}
.nav-links a:hover{color:var(--blue-bright)}

/* Hero */
.hero{padding:72px 0 25px}
.titleblock{overflow:hidden;background:linear-gradient(145deg,rgba(14,27,41,.98),rgba(9,20,32,.98));border:1px solid var(--border);border-radius:4px;box-shadow:0 20px 50px var(--shadow)}
.titleblock-top{display:flex;align-items:flex-start;justify-content:space-between;gap:25px;padding:30px;border-bottom:1px solid var(--border)}
.partno{margin-bottom:8px;color:var(--copper-light);font:400 11px var(--mono);letter-spacing:.16em}
.titleblock-top h1{font-size:clamp(32px,5vw,48px);line-height:1.08;font-weight:600}
.role{margin-top:10px;color:var(--text-dim);font:400 14px/1.7 var(--mono)}
.status-pill{flex-shrink:0;padding:6px 13px;border:1px solid var(--blue);border-radius:999px;color:var(--blue-bright);font:400 10px var(--mono);white-space:nowrap}
.specs{display:grid;grid-template-columns:repeat(4,1fr)}
.spec{padding:18px 22px;border-right:1px solid var(--border)}
.spec:last-child{border-right:0}
.spec .k{margin-bottom:5px;color:var(--text-dim);font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.spec .v{font:400 13px var(--mono)}
.contact-row{display:flex;flex-wrap:wrap;gap:8px 15px;padding:15px 28px;border-top:1px solid var(--border-soft);color:var(--text-dim);font:400 11px var(--mono)}
.contact-row a{color:var(--text-dim);text-decoration:none;border-bottom:1px dotted var(--text-dim)}
.contact-row a:hover{color:var(--blue-bright);border-color:var(--blue-bright)}
.separator{color:#526678}
.scope{border-top:1px solid var(--border-soft)}
.scope canvas{display:block;width:100%;height:190px}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;padding:12px 28px;border-top:1px solid var(--border-soft);font:400 10px var(--mono);color:var(--text-dim)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:18px;height:3px;border-radius:2px;display:inline-block}

/* Section */
.section{padding:68px 0;border-bottom:1px solid var(--border-soft)}
.section-tag{display:block;margin-bottom:9px;color:var(--copper-light);font:400 11px var(--mono);letter-spacing:.15em;text-transform:uppercase}
.section h2{margin-bottom:28px;font-size:clamp(27px,4vw,36px);line-height:1.2}
.summary-text{max-width:720px;margin:0 0 14px;color:var(--text-soft);font-size:15px;line-height:1.8}
.summary-text strong{color:var(--blue-bright)}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:65px}
.sub{color:var(--text-dim);font-size:14px;margin:-14px 0 28px}

/* Gambar */
.frame{position:relative;width:100%;height:100%;overflow:hidden;background:#050a10;border:1px solid rgba(117,199,255,.13);border-radius:4px}
.frame img{width:100%;height:100%;object-fit:cover}
.frame img.zoom{cursor:zoom-in}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center;color:var(--text-dim);font:400 10px var(--mono);background:repeating-linear-gradient(135deg,transparent 0 12px,rgba(105,195,242,.04) 12px 13px)}
.ph svg{width:28px;height:28px;opacity:.7}
.ph b{font-weight:500;color:var(--text-soft);font-size:11px}
.ph code{font:inherit;word-break:break-all;color:var(--copper-light)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.thumbs .t{width:84px;height:58px}
.thumbs .t .frame{border-radius:3px;border-color:rgba(117,199,255,.18)}
.thumbs .t img{opacity:.65;transition:opacity .2s;cursor:zoom-in}
.thumbs .t:hover img{opacity:1}

/* Keahlian */
.skill-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.skill-card{padding:25px;background:var(--panel);border:1px solid var(--border);border-radius:4px;transition:border-color .2s,transform .2s}
.skill-card:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.skill-number{margin-bottom:15px;color:var(--copper-light);font:400 11px var(--mono)}
.skill-card .cat{margin-bottom:12px;color:var(--blue-bright);font:400 11px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.skill-card .items{color:var(--text-dim);font-size:13px;line-height:1.9}

/* Kelompok & proyek */
.group+.group{margin-top:56px}
.cat-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin:0 0 22px;padding-bottom:10px;border-bottom:1px solid var(--border);font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--blue-bright)}
.cat-title .count{color:var(--text-dim);letter-spacing:.04em;text-transform:none}
.project{position:relative;margin-bottom:22px;overflow:hidden;background:linear-gradient(145deg,rgba(14,27,41,.98),rgba(9,20,32,.98));border:1px solid var(--border);border-radius:4px;transition:transform .2s,border-color .2s,box-shadow .2s}
.project::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--copper)}
.project:hover{transform:translateY(-2px);border-color:var(--border-strong);box-shadow:0 14px 35px rgba(0,0,0,.22)}
.project-head{padding:22px 27px 17px;border-bottom:1px solid var(--border-soft)}
.project-meta{display:flex;align-items:center;justify-content:space-between;gap:15px}
.yr{color:var(--copper-light);font:400 11px var(--mono)}
.project-id{color:var(--blue);font:400 10px var(--mono);letter-spacing:.08em}
.project-head h3{margin-top:7px;font-size:21px;line-height:1.35}
.subrole{margin-top:8px;color:var(--text-dim);font-size:13px;font-style:italic}
.badge{display:inline-block;margin-top:12px;padding:5px 10px;border:1px solid var(--blue);color:var(--blue-bright);font:400 10px var(--mono)}
.project-body{display:grid;grid-template-columns:300px 1fr;gap:26px;padding:22px 27px 25px}
.project-body .cover{aspect-ratio:4/3}
ul.pts{margin:0;padding-left:20px;color:var(--text-soft);font-size:14px;line-height:1.75;display:grid;gap:7px}
ul.pts li::marker{color:var(--copper)}
.specstrip{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;padding-top:15px;border-top:1px solid var(--border-soft)}
.specstrip .item{color:var(--text-dim);font:400 11px var(--mono)}
.specstrip .item b{margin-right:4px;color:var(--blue-bright);font-weight:500}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0;padding:0;list-style:none}
.tagrow li{padding:3px 9px;border:1px solid var(--border);border-radius:3px;color:var(--text-dim);font:400 10px var(--mono)}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:9px 14px;background:transparent;border:1px solid var(--blue);border-radius:3px;color:var(--blue-bright);font:400 11px var(--mono);text-decoration:none;cursor:pointer;transition:background .2s,color .2s,transform .2s}
.btn:hover{background:var(--blue);color:#06101a;transform:translateX(3px)}

/* Pengalaman */
.exp-item{display:grid;grid-template-columns:260px 1fr;gap:26px;margin-bottom:40px}
.exp-item:last-child{margin-bottom:0}
.exp-item .cover{aspect-ratio:4/3}
.exp-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.exp-top h3{font-size:18px;line-height:1.4}
.exp-company{margin-top:4px;color:var(--blue-bright);font-size:13px}
.dates{flex-shrink:0;color:var(--copper-light);font:400 11px var(--mono)}
.exp-item ul.pts{margin-top:12px;color:var(--text-dim)}

/* Publikasi */
.publication-card{padding:27px;background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--copper);border-radius:4px}
.publication-label{margin-bottom:12px;color:var(--copper-light);font:400 11px var(--mono);letter-spacing:.12em}
.publication-card h3{max-width:850px;margin-bottom:14px;font-size:20px;line-height:1.45}
.publication-card p{margin:0;color:var(--text-dim);font-size:14px}

/* Pendidikan */
.education-card{display:grid;grid-template-columns:1fr 1fr;gap:35px;padding:27px;background:var(--panel);border:1px solid var(--border);border-radius:4px}
.education-year{margin-bottom:8px;color:var(--copper-light);font:400 11px var(--mono)}
.education-card h3{font-size:21px}
.education-card p{margin:6px 0 0;color:var(--text-dim);font-size:14px}
.education-info{display:flex;flex-direction:column;gap:15px}
.education-info div{padding-bottom:12px;border-bottom:1px solid var(--border-soft)}
.education-info div:last-child{border-bottom:0;padding-bottom:0}
.education-info span{display:block;margin-bottom:4px;color:var(--text-dim);font:400 9px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.education-info strong{display:block;font-size:13px;font-weight:500}
.thesis{grid-column:1/-1;padding:16px 20px;border-left:3px solid var(--copper);background:rgba(196,123,69,.08);border-radius:0 4px 4px 0}
.thesis small{display:block;margin-bottom:6px;color:var(--copper-light);font:400 10px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.thesis p{margin:0;color:var(--text);font:500 16px/1.45 var(--head)}
h3.subh{margin:44px 0 16px;color:var(--blue-bright);font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.role-card{padding:20px;background:var(--panel);border:1px solid var(--border);border-radius:3px;transition:border-color .2s}
.role-card:hover{border-color:var(--border-strong)}
.role-card .rl{margin:0;color:var(--copper-light);font:400 10px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.role-card h4{margin:6px 0 2px;font:600 16px/1.35 var(--head)}
.role-card .dv{margin:0 0 10px;color:var(--text-dim);font-size:12px}
.role-card p.ds{margin:0;color:var(--text-soft);font-size:13px;line-height:1.7}

/* Sertifikat */
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.cert{padding:14px 14px 18px;background:var(--panel);border:1px solid var(--border);border-radius:4px;transition:border-color .2s,transform .2s}
.cert:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.cert .cm{aspect-ratio:4/3}
.cert h3{margin:14px 2px 2px;font-size:16px}
.cert p{margin:0 2px;color:var(--text-dim);font:400 11px var(--mono)}
.cert .btn{margin:10px 2px 0}

/* Kontak */
.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}
.contact-card{display:flex;flex-direction:column;gap:6px;padding:20px;background:var(--panel);border:1px solid var(--border);border-radius:3px;text-decoration:none;transition:border-color .2s}
.contact-card:hover{border-color:var(--border-strong)}
.contact-card span{color:var(--text-dim);font:400 9px var(--mono);letter-spacing:.12em}
.contact-card strong{color:var(--text-soft);font-size:13px;font-weight:500;word-break:break-word}
footer{padding:45px 0 70px;text-align:center}
.footer-line{width:45px;height:2px;margin:0 auto 18px;background:var(--copper)}
footer p{margin:0 0 3px;font:400 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
footer span{color:var(--text-dim);font:400 9px var(--mono)}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;background:rgba(3,8,13,.9);backdrop-filter:blur(7px);padding:24px}
.lb.open{display:flex}
.lb img{max-width:min(1100px,100%);max-height:84vh;border:1px solid var(--border-strong);border-radius:4px;background:#050a10}
.lb button{position:absolute;width:40px;height:40px;border-radius:3px;border:1px solid rgba(117,199,255,.25);background:transparent;color:var(--text-dim);font-size:24px;cursor:pointer}
.lb button:hover{background:var(--copper);border-color:var(--copper);color:#fff}
.lb .x{top:calc(env(safe-area-inset-top,0px) + 16px);right:16px}
.lb .p{left:14px;top:50%}.lb .n{right:14px;top:50%}

/* Responsif */
@media (max-width:850px){
  .nav-links{gap:12px}
  .specs{grid-template-columns:repeat(2,1fr)}
  .spec:nth-child(2n){border-right:0}
  .about-grid,.education-card,.contact-grid,.skill-grid{grid-template-columns:1fr;gap:20px}
  .project-body,.exp-item{grid-template-columns:1fr}
}
@media (max-width:600px){
  .wrap{width:min(calc(100% - 30px),1000px)}
  .nav-container{width:min(calc(100% - 30px),1000px)}
  .nav-links{display:none}
  .hero{padding-top:30px}
  .titleblock-top{flex-direction:column;padding:24px}
  .titleblock-top h1{font-size:34px}
  .role{font-size:11px}
  .specs{grid-template-columns:1fr}
  .spec{border-right:0;border-bottom:1px solid var(--border-soft)}
  .contact-row{flex-direction:column;gap:7px}
  .separator{display:none}
  .section{padding:48px 0}
  .project-head,.project-body{padding-left:20px;padding-right:20px}
  .exp-top{flex-direction:column;gap:5px}
}
</style>
</head>
<body>

  <div class="nav-container">

<main id="top">

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v);
  }
  kids.flat().forEach(c => c != null && el.append(c.nodeType ? c : document.createTextNode(c)));
  return el;
}
const ICON_IMG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>';

/* Lightbox */
const lb = { srcs: [], i: 0, alt: "" };
function lbShow() { $("#lbImg").src = lb.srcs[lb.i]; $("#lbImg").alt = lb.alt; $("#lb").classList.add("open"); const multi = lb.srcs.length > 1; $("#lbP").hidden = $("#lbN").hidden = !multi; }
function lbOpen(srcs, i, alt) { lb.srcs = srcs; lb.i = i; lb.alt = alt; lbShow(); $("#lbX").focus(); }
function lbClose() { $("#lb").classList.remove("open"); }
function lbStep(d) { lb.i = (lb.i + d + lb.srcs.length) % lb.srcs.length; lbShow(); }
$("#lbX").onclick = lbClose;
$("#lbP").onclick = e => { e.stopPropagation(); lbStep(-1); };
$("#lbN").onclick = e => { e.stopPropagation(); lbStep(1); };
$("#lb").onclick = e => { if (e.target.id === "lb") lbClose(); };
document.addEventListener("keydown", e => {
  if (!$("#lb").classList.contains("open")) return;
  if (e.key === "Escape") lbClose();
  if (e.key === "ArrowLeft") lbStep(-1);
  if (e.key === "ArrowRight") lbStep(1);
});

/* Gambar dengan placeholder otomatis */
function placeholder(src, label) {
  const p = h("div", { class: "ph" });
  p.innerHTML = ICON_IMG;
  p.append(h("b", { text: label || "Tambahkan gambar" }), h("code", { text: src }));
  return p;
}
function media(images, alt, label) {
  const list = images.slice();
  const ok = list.map(() => false);
  const frame = h("div", { class: "frame" });
  const thumbs = h("div", { class: "thumbs" });
  const wrap = h("div", { class: "media" }, frame);
  const open = src => () => { const l = list.filter((_, i) => ok[i]); lbOpen(l, l.indexOf(src), alt); };
  const ph = placeholder(list[0], label);
  frame.append(ph);
  const main = new Image(); main.alt = alt; main.decoding = "async";
  main.onload = () => { ok[0] = true; ph.remove(); main.classList.add("zoom"); main.onclick = open(list[0]); frame.append(main); };
  main.src = list[0];
  if (list.length > 1) {
    wrap.append(thumbs);
    list.slice(1).forEach((src, k) => {
      const idx = k + 1;
      const im = new Image(); im.alt = alt + " (" + (idx + 1) + ")"; im.decoding = "async";
      im.onload = () => { ok[idx] = true; im.onclick = open(src); thumbs.append(h("div", { class: "t" }, h("div", { class: "frame" }, im))); };
      im.src = src;
    });
  }
  return wrap;
}

/* Animasi gelombang SPWM */
const cv = $("#scope"), ctx = cv.getContext("2d");
let phase = 0;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function fitScope() { const d = window.devicePixelRatio || 1; cv.width = Math.round(cv.clientWidth * d); cv.height = Math.round(cv.clientHeight * d); ctx.setTransform(d, 0, 0, d, 0, 0); }
function drawScope() {
  const W = cv.clientWidth, H = cv.clientHeight; if (!W) return;
  ctx.clearRect(0, 0, W, H);
  const ink = css("--text"), cop = css("--copper-light"), acc = css("--blue-bright");
  const topMid = H * .27, topAmp = H * .20, botMid = H * .78, botAmp = H * .13;
  const cycles = W < 560 ? 2 : 3, ratio = 12;
  ctx.strokeStyle = "rgba(105,195,242,.19)"; ctx.lineWidth = 1; ctx.setLineDash([4, 6]);
  [topMid, botMid].forEach(y => { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); });
  ctx.setLineDash([]);
  const ref = t => Math.sin(2 * Math.PI * t);
  const tri = t => { const f = (t * ratio) % 1; const x = f < 0 ? f + 1 : f; return x < .5 ? 4 * x - 1 : 3 - 4 * x; };
  ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.beginPath();
  for (let x = 0; x <= W; x += 2) { const t = (x / W) * cycles + phase; const y = topMid - ref(t) * topAmp * .85; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
  ctx.strokeStyle = cop; ctx.lineWidth = 1.4; ctx.beginPath();
  for (let x = 0; x <= W; x++) { const t = (x / W) * cycles + phase; const y = topMid - tri(t) * topAmp; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
  ctx.strokeStyle = acc; ctx.lineWidth = 2.4; ctx.lineJoin = "round"; ctx.beginPath();
  let prev = null;
  for (let x = 0; x <= W; x++) {
    const t = (x / W) * cycles + phase;
    const v = ref(t) * .85 > tri(t) ? 1 : -1, y = botMid - v * botAmp;
    if (prev === null) ctx.moveTo(x, y); else { if (v !== prev) ctx.lineTo(x, botMid - prev * botAmp); ctx.lineTo(x, y); }
    prev = v;
  }
  ctx.stroke();
}
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function tick() { phase += 0.0011; drawScope(); requestAnimationFrame(tick); }
window.addEventListener("resize", () => { fitScope(); drawScope(); });
fitScope(); drawScope();
if (!reduce) requestAnimationFrame(tick);
